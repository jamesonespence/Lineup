<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><title>Sabres at Maple Leafs Lineup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Big+Shoulders+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
/* Layout: two team columns side by side (away left, home right); on phones one column with a team switch.
   Each line is a box of player tiles. Tap a tile for the stat sheet. */
:root{
  --bg:#EDF1F6; --surface:#FFFFFF; --ink:#0D1B2E; --muted:#5A6A7E; --line:#D2DBE6;
  --tile:#F4F7FA; --tile-hover:#E6EDF5; --focus:#1F6FEB; --warn:#A8481A; --warn-bg:#FBEBDD;
  --tor:#00205B; --tor-acc:#9FBBF4; --tor-num:#00205B;
  --uta:#14171B; --uta-acc:#7FBDF2; --uta-num:#1D6DB0;
  --edm:#041E42; --edm-acc:#FF8A4C; --edm-num:#C2410C;
  --lak:#111111; --lak-acc:#B4BCC1; --lak-num:#4A5258;
  --mtl:#A6192E; --mtl-acc:#C9D6F0; --mtl-num:#A6192E;
  --wsh:#041E42; --wsh-acc:#FF7B84; --wsh-num:#C8102E;
  --buf:#003087; --buf-acc:#FFB81C; --buf-num:#003087;
  --display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1119; --surface:#121C29; --ink:#E7EDF5; --muted:#93A4B9; --line:#243448;
    --tile:#192637; --tile-hover:#213249; --focus:#6AA5FF; --warn:#F0A072; --warn-bg:#3A2616;
    --tor:#0E2C70; --tor-num:#8FB0F5; --uta:#000000; --uta-num:#86C1F2; --edm:#0A2A5C; --edm-num:#FF8A4C; --lak:#000000; --lak-num:#C5CCD1; --mtl:#7D1424; --mtl-num:#FF7A8A; --wsh:#0A2A5C; --wsh-num:#FF7B84; --buf:#0B2B6B; --buf-num:#F5C451;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1119; --surface:#121C29; --ink:#E7EDF5; --muted:#93A4B9; --line:#243448;
  --tile:#192637; --tile-hover:#213249; --focus:#6AA5FF; --warn:#F0A072; --warn-bg:#3A2616;
  --tor:#0E2C70; --tor-num:#8FB0F5; --uta:#000000; --uta-num:#86C1F2; --edm:#0A2A5C; --edm-num:#FF8A4C; --lak:#000000; --lak-num:#C5CCD1; --mtl:#7D1424; --mtl-num:#FF7A8A; --wsh:#0A2A5C; --wsh-num:#FF7B84; --buf:#0B2B6B; --buf-num:#F5C451;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.35}
button{font:inherit;color:inherit}
[data-team]{--team-bg:#1D2733;--team-acc:#9FB3C8;--num:var(--ink)}
[data-team="tor"]{--team-bg:var(--tor);--team-acc:var(--tor-acc);--num:var(--tor-num)}
[data-team="uta"]{--team-bg:var(--uta);--team-acc:var(--uta-acc);--num:var(--uta-num)}
[data-team="edm"]{--team-bg:var(--edm);--team-acc:var(--edm-acc);--num:var(--edm-num)}
[data-team="lak"]{--team-bg:var(--lak);--team-acc:var(--lak-acc);--num:var(--lak-num)}
[data-team="mtl"]{--team-bg:var(--mtl);--team-acc:var(--mtl-acc);--num:var(--mtl-num)}
[data-team="wsh"]{--team-bg:var(--wsh);--team-acc:var(--wsh-acc);--num:var(--wsh-num)}
[data-team="buf"]{--team-bg:var(--buf);--team-acc:var(--buf-acc);--num:var(--buf-num)}

.app{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:20px 36px;display:grid;gap:16px}
.hd{display:grid;gap:6px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(36px,8vw,58px);line-height:.95;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.meta{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.hint{font-size:13px;color:var(--muted)}

.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,220px));gap:8px;margin-bottom:12px}
.tab.tab-team{display:none}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;font-weight:600;cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.tab small{font-weight:500;opacity:.75;font-variant-numeric:tabular-nums}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab:focus-visible,.tile:focus-visible,.link:focus-visible,.close:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.lineups{display:grid;gap:16px;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
@media (max-width:899px){
  .tabs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tab.tab-team{display:flex}
  .tab.tab-lineups{display:none}
  .tab{flex-direction:column;gap:2px;padding:8px 10px}
  .lineups{grid-template-columns:minmax(0,1fr)}
}

.team{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.band{background:var(--team-bg);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.band h2{margin:0;font-family:var(--display);font-weight:800;font-size:36px;line-height:.95;text-transform:uppercase}
.band .sub{margin-top:4px;font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--team-acc)}
.band .rec{text-align:right;font-family:var(--display);font-weight:700;font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.band .rec span{display:block;margin-top:4px;font-family:var(--body);font-weight:600;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--team-acc)}
.body{padding:14px;display:grid;gap:16px}
.sec{display:grid;gap:8px}
.sec-h{font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.box{border:1px solid var(--line);border-radius:8px;padding:8px;display:grid;gap:6px}
.box-l{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.row{display:grid;gap:6px;grid-template-columns:repeat(3,minmax(0,1fr))}
.row.two{grid-template-columns:repeat(2,minmax(0,1fr))}

.tile{display:grid;gap:1px;align-content:start;min-width:0;text-align:left;cursor:pointer;background:var(--tile);border:1px solid transparent;border-radius:6px;padding:7px 8px 8px}
.tile:hover{background:var(--tile-hover)}
.t-top{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.t-slot{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.t-num{font-family:var(--display);font-weight:800;font-size:22px;line-height:1;color:var(--num);font-variant-numeric:tabular-nums}
.t-first{font-size:11px;color:var(--muted);overflow-wrap:anywhere}
.t-name{font-weight:600;font-size:15px;line-height:1.1;overflow-wrap:anywhere}
.t-sub{margin-top:3px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.badge{display:inline-block;margin-top:4px;justify-self:start;font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;padding:2px 6px;border-radius:4px;background:var(--team-bg);color:#fff}
.badge.alt{background:transparent;color:var(--muted);border:1px solid var(--line)}

.st{display:grid;gap:8px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:480px){.st{grid-template-columns:minmax(0,1fr)}}
.st-b{border:1px solid var(--line);border-radius:8px;padding:8px;display:grid;gap:4px;align-content:start}
.names{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:13px}
.link{background:none;border:0;padding:0;cursor:pointer;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.link:hover{text-decoration-color:var(--ink)}
.plain{font-size:13px;color:var(--muted)}
.avail{display:grid;gap:6px}
.avail-l{font-size:13px;display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline}
.avail-l b{font-weight:600}
.note{color:var(--muted)}

.matchup{display:grid;gap:12px}
.mu-t{margin:8px 0 0;font-family:var(--display);font-weight:800;font-size:clamp(28px,6vw,40px);line-height:1;text-transform:uppercase}
.mu-n{font-size:12px;color:var(--muted)}
.mu-g{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
@media (max-width:899px){.mu-g{grid-template-columns:minmax(0,1fr)}}
.mu-b{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:8px}
.mu-h{font-family:var(--display);font-weight:800;font-size:20px;text-transform:uppercase;letter-spacing:.02em}
table.mu{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
table.mu th,table.mu td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:right}
table.mu th:first-child{text-align:left;font-weight:500;color:var(--muted)}
table.mu thead th{font-weight:700;color:var(--num);border-bottom:2px solid var(--line)}
table.mu td.win{font-weight:700;color:var(--num)}
.mu-v{margin:0;font-size:14px;font-weight:600}
.mu-sub{display:grid;gap:8px;align-content:start;min-width:0}
.mu-h2{font-family:var(--display);font-weight:800;font-size:16px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.mu-split{display:grid;gap:18px;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
@media (max-width:899px){.mu-split{grid-template-columns:minmax(0,1fr)}}
.mu-sec{display:grid;gap:12px;scroll-margin-top:60px}
.mu-bl-l{margin:0;padding:0;list-style:none;display:grid;gap:8px;font-size:14px}
.mu-bl-l li{display:grid;grid-template-columns:104px minmax(0,1fr);gap:10px;padding-top:8px;border-top:1px solid var(--line)}
.mu-bl-l li:first-child{border-top:0;padding-top:0}
.mu-bl-l b{font-family:var(--display);font-weight:800;font-size:15px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
.mu-jump{position:sticky;top:0;z-index:6;display:flex;gap:6px;overflow-x:auto;padding:8px 0;margin:0 -2px;background:var(--bg);scrollbar-width:none}
.mu-jump::-webkit-scrollbar{display:none}
.mu-jump button{flex:0 0 auto;font:inherit;font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.mu-jump button:active{background:var(--ink);color:var(--bg)}
.mu-l{margin:0;padding:0;list-style:none;display:grid;gap:8px;font-size:13px}
.mu-l span{color:var(--muted)}
.mu-ff{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:560px){.mu-ff{grid-template-columns:minmax(0,1fr)}}
.mu-f{background:var(--tile);border-radius:8px;padding:8px 10px;border-left:4px solid var(--team-acc);display:grid;gap:6px}
.mu-fh{font-family:var(--display);font-weight:800;font-size:18px;text-transform:uppercase}
.mu-fs,.mu-fn{font-size:12px;color:var(--muted)}
.chips{display:flex;gap:4px}
.chip{flex:1;border-radius:6px;padding:4px 0;text-align:center;font-weight:700;font-size:13px;display:grid;line-height:1.1}
.chip small{font-weight:500;font-size:10px;opacity:.85}
.chip.w{background:#1E7A4A;color:#fff}.chip.l{background:#B3362F;color:#fff}.chip.otl{background:#B8791A;color:#fff}
.inj-t{margin:8px 0 0;font-family:var(--display);font-weight:800;font-size:clamp(28px,6vw,40px);line-height:1;text-transform:uppercase}
.inj-g{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
@media (max-width:899px){.inj-g{grid-template-columns:minmax(0,1fr)}}
.inj-b{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.inj-bh{padding:10px 14px;background:var(--team-bg);color:#fff;font-family:var(--display);font-weight:800;font-size:22px;text-transform:uppercase;display:flex;justify-content:space-between;align-items:baseline}
.inj-bh small{font-family:var(--body);font-weight:500;font-size:12px;color:var(--team-acc);text-transform:none}
.inj-r{padding:10px 14px;border-top:1px solid var(--line);display:grid;gap:4px}
.inj-r:first-of-type{border-top:0}
.inj-n{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:baseline;font-weight:700}
.inj-n .pos{font-weight:500;font-size:12px;color:var(--muted)}
.inj-i{font-size:13px;font-weight:600}
.inj-p{font-size:13px;color:var(--muted)}
.inj-u{font-size:11px;color:var(--muted)}
.pill{display:inline-block;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:700;color:#fff}
.pill.out{background:#B3362F}.pill.dtd{background:#B8791A}.pill.nr{background:#5B6B7F}
.foot{font-size:12px;color:var(--muted);display:grid;gap:4px}
.foot a{color:inherit}

/* Player sheet */
.veil{position:fixed;inset:0;z-index:20;background:rgba(5,10,18,.6);display:flex;align-items:flex-end;justify-content:center}
.veil[hidden]{display:none}
.sheet{width:100%;max-width:480px;max-height:90%;overflow:auto;background:var(--surface);color:var(--ink);border-radius:14px 14px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:700px){.veil{align-items:center}.sheet{border-radius:14px}}
.m-head{background:var(--team-bg);color:#fff;padding:16px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center}
.m-num{font-family:var(--display);font-weight:800;font-size:52px;line-height:.9;color:var(--team-acc);font-variant-numeric:tabular-nums}
.m-name{font-family:var(--display);font-weight:800;font-size:30px;line-height:.98;text-transform:uppercase;overflow-wrap:anywhere}
.m-sub{margin-top:4px;font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--team-acc)}
.close{align-self:start;background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:6px;padding:6px 10px;font-size:13px;font-weight:600;cursor:pointer}
.m-body{padding:14px 16px 18px;display:grid;gap:14px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;font-weight:600;padding:3px 8px;border-radius:5px;background:var(--tile);border:1px solid var(--line)}
.status{font-size:13px;font-weight:600;padding:8px 10px;border-radius:6px;background:var(--warn-bg);color:var(--warn)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.stat{background:var(--tile);border-radius:6px;padding:8px 6px;text-align:center;min-width:0}
.stat b{display:block;font-family:var(--display);font-weight:700;font-size:24px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{display:block;margin-top:3px;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.m-foot{font-size:12px;color:var(--muted)}
.stabs{display:flex;gap:6px;padding:12px 16px 0}
.stabs button{border:1px solid var(--line);background:var(--tile);border-radius:6px;padding:6px 14px;font-weight:600;font-size:13px;cursor:pointer}
.stabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stabs button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.bio{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 8px;padding-top:12px;border-top:1px solid var(--line)}
.bio div{display:grid;gap:1px;min-width:0;align-content:start}
.bio .wide{grid-column:1/-1}
.bio span{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.bio b{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.tbl-w{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:7px 5px;text-align:right;white-space:nowrap}
.tbl thead th{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
.tbl tbody th{text-align:left;font-weight:600}
.tbl tbody tr+tr{border-top:1px solid var(--line)}
.bars{display:grid;gap:14px}
.bar{display:grid;gap:5px}
.bar-top{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.bar-top b{font-variant-numeric:tabular-nums}
.track{position:relative;height:8px;border-radius:4px;background:var(--tile);border:1px solid var(--line)}
.track i{position:absolute;inset:0 auto 0 0;border-radius:3px;background:var(--num)}
.track s{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--muted);opacity:.5}
.bar-sub{font-size:11px;color:var(--muted)}
.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}
.prof{display:grid;gap:6px;padding:10px 12px;border-radius:8px;background:var(--tile);border-left:4px solid var(--team-acc)}
.prof-t{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.05;text-transform:uppercase}
.prof-s{font-size:13px;font-weight:600}
.why{margin:0;padding-left:18px;font-size:12px;color:var(--muted);display:grid;gap:2px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:rise .16s ease-out}@keyframes rise{from{transform:translateY(14px);opacity:.6}to{transform:none;opacity:1}}}
</style>

<div class="app">
  <header class="hd">
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="title"></h1>
    <div class="meta" id="meta"></div>
    <div class="hint">Tap any player for his season stats and tonight role. The Matchup tab compares the two teams.</div>
  </header>
  <main id="view" data-active="">
    <div class="tabs" id="tabs"></div>
    <div class="lineups" id="lineups"></div>

  <section class="matchup" id="matchup"></section>
  <section class="matchup" id="injuries"></section>
  <footer class="foot" id="foot"></footer>
</div>

<div class="veil" id="veil" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="m-name"></div>
</div>

  const fr = foRead(id, p);
  if (fr && !isD) {
    why.push("Faceoffs: " + fr.pct.toFixed(1) + "% on " + fr.n.toLocaleString("en-US") + " draws in " + fr.yr + " (" + foWord(fr.pct) + "; league average is about 50%)");
    if (fr.n >= 300 && fr.pct >= 55) label += " (strong on faceoffs)";
    else if (fr.n >= 300 && fr.pct <= 46) label += " (weak on faceoffs)";
  }
  if (l[0] >= 20 && xs.ls2 && xs.ls2[0] >= 20) {
    const q1 = (l[1] + l[2]) / l[0], q2 = (xs.ls2[1] + xs.ls2[2]) / xs.ls2[0], dq = q1 - q2;
    why.push("Points per game: " + q1.toFixed(2) + " in " + seasonLbl(-1) + ", " + q2.toFixed(2) + " in " + seasonLbl(-2) + (Math.abs(dq) < 0.08 ? " (steady)" : dq > 0 ? " (trending up)" : " (trending down)"));
  }
  if (xs.h && xs.h[1] != null && l[0] > 0) {
    let t = "Hits: " + xs.h[1] + " in " + l[0] + " GP in " + seasonLbl(-1) + " (" + (xs.h[1] / l[0]).toFixed(1) + " per game, " + ord(hitP) + " percentile per 60)";
    if (xs.h[2] != null && xs.ls2) t += "; " + xs.h[2] + " in " + xs.ls2[0] + " GP in " + seasonLbl(-2);
    if (xs.h[0] != null && p.gp > 0) t += "; " + xs.h[0] + " in " + p.gp + " GP so far this season";
    why.push(t);
  }
  if (l[0] >= 10) {
    const pg = l[4] / l[0];
    let t = "Penalty minutes: " + l[4] + " in " + seasonLbl(-1) + " (" + pg.toFixed(2) + " per game, " + pimWord(pg) + ")";
    if (xs.ls2 && xs.ls2[0] >= 10) t += "; " + xs.ls2[4] + " in " + seasonLbl(-2);
    why.push(t);
  }
  if (!bs.cur && p.gp > 0) why.push("This season: " + ((p.g + p.a) / p.gp).toFixed(2) + " points per game in " + p.gp + " GP. Type switches to " + seasonLbl(0) + " production at 25 GP.");
  if (gp < 25) why.push("Only " + gp + " GP in 2025-26, so this read is thin.");
  return { label: label, why: why };
}

function profileHTML(id, p, b) {
  const st = styleRead(id, p, b), sz = sizeRead(p, b);
  return '<div class="prof"><div class="prof-t">' + esc(st.label) + '</div>' +
    '<div class="prof-s">' + esc(sz.line) + "</div>" +
    '<ul class="why">' + st.why.map((w) => "<li>" + esc(w) + "</li>").join("") + "</ul>" +
    '<div class="m-foot">Type is derived from stats, not a scouting opinion. Points use the current season once a player has 25 GP, otherwise last season. Shots, blocks and ice-time splits are last season. Hits and penalty minutes are shown for the last two seasons plus this one; faceoff % is for centers only.</div></div>';
}

function barRow(label, valueText, pct, peers) {
  return '<div class="bar"><div class="bar-top"><span>' + label + "</span><b>" + valueText + "</b></div>" +
    '<div class="track"><i style="width:' + pct + '%"></i><s style="left:25%"></s><s style="left:50%"></s><s style="left:75%"></s></div>' +
    '<div class="bar-sub">About the ' + ord(pct) + " percentile among " + peers + "</div></div>";
}

function leagueBars(p, b, id) {
  const l = b.ls;
  if (!l || l[0] < 20) {
    return '<div class="plain">No league comparison. A player needs at least 20 games in 2025-26, and this one had ' + (l ? l[0] : 0) + ".</div>";
  }
  if (p.pos === "G") {
    const g = LEAGUE.G, peers = g.n + " goalies";
    return '<div class="sec-h">Goaltending</div><div class="bars">' +
      barRow("Save percentage", l[6], pctile(parseFloat(l[6]), g.sv, false), peers) +
      barRow("Goals against average", l[5], pctile(parseFloat(l[5]), g.gaa, true), peers) + "</div>" +
      '<div class="m-foot">2025-26 regular season, goalies with 20+ games. Percentiles are estimated from league cut points. Ticks mark the 25th, 50th and 75th percentile.</div>';
  }
  const a = ADV[id], grp = grpOf(p), who = p.pos === "D" ? "defensemen" : "forwards";
  const bs = basisOf(p, b), prev = seasonLbl(-1);
  const ppg = (bs.g + bs.a) / bs.gp;
  const peers = grp.n + " " + who, allPeers = grp.nAll + " " + who;
  const offense = [barRow("Points per game, " + bs.yr, ppg.toFixed(2), pctile(ppg, grp.ppg, false), peers)];
  const defense = [];
  const use = [];
  if (a) {
    offense.push(barRow("Shots per 60 at 5v5, " + prev, a[5].toFixed(1), pctile(a[5], grp.ish, false), allPeers));
    defense.push(barRow("Shot-attempt share at 5v5, " + prev, a[4].toFixed(1) + "%", pctile(a[4] / 100, grp.sat, false), allPeers));
    defense.push(barRow("Takeaways per 60, " + prev, a[2].toFixed(2), pctile(a[2], grp.tk, false), allPeers));
    defense.push(barRow("Blocked shots per 60, " + prev, a[1].toFixed(2), pctile(a[1], grp.blk, false), allPeers));
    defense.push(barRow("Hits per 60, " + prev, a[0].toFixed(1), pctile(a[0], grp.hits, false), allPeers));
  }
  const t = bs.toi;
  if (t) use.push(barRow("Ice time per game, " + bs.yr, toi(t), pctile(t, grp.toi, false), peers));
  let html = '<div class="sec-h">Offense</div><div class="bars">' + offense.join("") + "</div>";
  if (defense.length) html += '<div class="sec-h">Defense and possession</div><div class="bars">' + defense.join("") + "</div>";
  html += '<div class="sec-h">Deployment</div><div class="bars">' + use.join("") + "</div>";
  if (a) html += '<div class="grid grid3">' + stat(toi(a[7]), "Even strength") + stat(toi(a[8]), "Power play") + stat(toi(a[9]), "Penalty kill") + "</div>" +
    '<div class="m-foot">Average ice time per game in ' + prev + ".</div>";
  html += '<div class="m-foot">Points and ice time use ' + bs.yr + ' when a player has 25+ GP this season, otherwise ' + prev + '. Both compare with ' + prev + ' players who had 40+ games. Shots, possession and defense compare with every skater who played a game, so call-ups are in the pool and these are approximate. Percentiles are estimated from league cut points. Ticks mark the 25th, 50th and 75th percentile.' +
    (l[0] < 40 ? " Small sample for this player: " + l[0] + " GP." : "") + "</div>";
  return html;
}

function openSheet(id, slotLabel) {
  const p = P[id]; if (!p) return;
  const b = BIO[id];
  const tk = p.t, T = GAME.teams[tk];
  const rl = roles(tk, id);
  const tags = [];
  if (slotLabel) tags.push(slotLabel);
  rl.forEach((r) => tags.push(r));
  const status = statusFor(tk, id);
  let grid, foot;
  if (p.pos === "G") {
    grid = stat(p.gp, "GP") + stat(p.gs, "GS") + stat(p.w + "-" + p.l + "-" + p.otl, "W-L-OT") + stat(p.gaa, "GAA") +
      stat(p.sv, "SV%") + stat(p.sa, "Shots against") + stat(p.ga, "Goals against") + stat(p.so, "Shutouts");
    foot = seasonLbl(0) + " regular season, " + p.gp + " GP.";
  } else {
    const pts = p.g + p.a;
    const sh = p.sog ? (100 * p.g / p.sog).toFixed(1) : "0.0";
    const xx = XS[id] || {}, h0 = xx.h && xx.h[0] != null ? xx.h[0] : null;
    const extra = (p.pos === "C" ? stat(p.fo.toFixed(1), "FO%") : "") + stat(p.gw, "GW goals") +
      (h0 != null ? stat(h0, "Hits") + stat((h0 / p.gp).toFixed(1), "Hits/GP") : "") + stat((p.pim / p.gp).toFixed(2), "PIM/GP");
    grid = stat(p.gp, "GP") + stat(p.g, "Goals") + stat(p.a, "Assists") + stat(pts, "Points") +
      stat(sgn(p.pm), "+/-") + stat(p.pim, "PIM") + stat(p.ppg, "PP goals") + stat(p.sog, "Shots") +
      stat(sh, "Shot %") + stat(toi(p.toi), "TOI/GP") + stat((pts / p.gp).toFixed(2), "Pts/GP") + extra;
    foot = seasonLbl(0) + " regular season, " + p.gp + " GP. TOI is average per game.";
  }
  const sheet = $("#sheet");
  sheet.dataset.team = tk;
  sheet.innerHTML =
    '<div class="m-head"><div class="m-num">' + (p.num == null ? "" : p.num) + "</div>" +
    '<div><div class="m-name" id="m-name">' + esc(p.n) + '</div><div class="m-sub">' + esc(T.city + " " + T.name) + " | " + POS[p.pos] + "</div></div>" +
    '<button class="close" type="button" id="close">Close</button></div>' +
    '<div class="stabs"><button type="button" data-st="ov" aria-pressed="true">Overview</button>' +
    '<button type="button" data-st="cx" aria-pressed="false">Context</button></div>' +
    '<div class="m-body" data-panel="ov">' +
    (status ? '<div class="status">' + esc(status) + "</div>" : "") +
    (tags.length ? '<div class="tags">' + tags.map((t) => '<span class="tag">' + esc(t) + "</span>").join("") + "</div>" : "") +
    profileHTML(id, p, b) +
    '<div class="grid">' + grid + "</div>" +
    '<div class="m-foot">' + esc(foot) + "</div>" +
    bioStrip(p, b) + "</div>" +
    '<div class="m-body" data-panel="cx" hidden>' +
    '<div class="sec-h">Season by season</div>' + seasonTable(p, b, id) + seasonNote(p, id) +
    leagueBars(p, b, id) + "</div>";
  lastFocus = document.activeElement;
  $("#veil").hidden = false;
  document.body.style.overflow = "hidden";
  sheet.scrollTop = 0;
  $("#close").focus();
}

function closeSheet() {
  $("#veil").hidden = true;
  document.body.style.overflow = "";
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}

document.addEventListener("click", (e) => {
  const jp = e.target.closest("[data-jump]");
  if (jp) { const el = document.getElementById(jp.dataset.jump); if (el && el.scrollIntoView) el.scrollIntoView({ behavior: "smooth", block: "start" }); return; }
  const st = e.target.closest("[data-st]");
  if (st) {
    document.querySelectorAll("[data-st]").forEach((b) => b.setAttribute("aria-pressed", String(b === st)));
    document.querySelectorAll("[data-panel]").forEach((pn) => { pn.hidden = pn.dataset.panel !== st.dataset.st; });
    return;
  }
  const tab = e.target.closest("[data-tab]");
  if (tab) {
    const v = tab.dataset.tab;
    $("#view").dataset.active = v;
    $("#lineups").hidden = v === "matchup" || v === "injuries";
    $("#matchup").hidden = v !== "matchup";
    $("#injuries").hidden = v !== "injuries";
    document.querySelectorAll(".tab").forEach((b) => b.setAttribute("aria-pressed", String(b === tab)));
    return;
  }
  if (e.target.id === "veil" || e.target.id === "close") { closeSheet(); return; }
  const pl = e.target.closest("[data-pid]");
  if (pl) openSheet(pl.dataset.pid, pl.dataset.slotlabel);
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("#veil").hidden) closeSheet(); });

render();
</script>
</body></html>
